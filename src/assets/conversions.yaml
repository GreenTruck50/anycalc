  - name: "Volume Conversion"
    icon: "ft.Icons.WATER_DROP"
    description: "Convert between liters, milliliters, gallons, cups, cubic inches, etc."
    formulas:
      # Metric cubic units - exact by definition of the SI prefixes.
      1:
        type: "MD"
        input_unit_id: "volume_cubic_millimeter"
        output_unit_id: "volume_cubic_centimeter"
        formula: "x / 1000"
      2:
        type: "MD"
        input_unit_id: "volume_cubic_centimeter"
        output_unit_id: "volume_cubic_decimeter"
        formula: "x / 1000"
      3:
        type: "MD"
        input_unit_id: "volume_cubic_decimeter"
        output_unit_id: "volume_cubic_meter"
        formula: "x / 1000"
      4:
        type: "MD"
        input_unit_id: "volume_cubic_meter"
        output_unit_id: "volume_cubic_kilometer"
        formula: "x / 1000000000"

      # Metric liquid units - the liter is exactly one cubic decimeter,
      # so cm3 = mL and dm3 = L exactly.
      5:
        type: "MD"
        input_unit_id: "volume_cubic_centimeter"
        output_unit_id: "volume_milliliter"
        formula: "x"
      6:
        type: "MD"
        input_unit_id: "volume_milliliter"
        output_unit_id: "volume_microliter"
        formula: "x * 1000"
      7:
        type: "MD"
        input_unit_id: "volume_milliliter"
        output_unit_id: "volume_centiliter"
        formula: "x / 10"
      8:
        type: "MD"
        input_unit_id: "volume_centiliter"
        output_unit_id: "volume_deciliter"
        formula: "x / 10"
      9:
        type: "MD"
        input_unit_id: "volume_deciliter"
        output_unit_id: "volume_liter"
        formula: "x / 10"
      10:
        type: "MD"
        input_unit_id: "volume_liter"
        output_unit_id: "volume_hectoliter"
        formula: "x / 100"
      11:
        type: "MD"
        input_unit_id: "volume_hectoliter"
        output_unit_id: "volume_kiloliter"
        formula: "x / 10"

      # Metric culinary units - defined as exact numbers of milliliters.
      12:
        type: "MD"
        input_unit_id: "volume_metric_teaspoon"
        output_unit_id: "volume_milliliter"
        formula: "x * 5"
      13:
        type: "MD"
        input_unit_id: "volume_metric_tablespoon"
        output_unit_id: "volume_milliliter"
        formula: "x * 15"
      14:
        type: "MD"
        input_unit_id: "volume_metric_cup"
        output_unit_id: "volume_milliliter"
        formula: "x * 250"
      15:
        # US legal cup as used in FDA nutrition labeling (21 CFR 101.9).
        type: "MD"
        input_unit_id: "volume_us_legal_cup"
        output_unit_id: "volume_milliliter"
        formula: "x * 240"

      # Imperial / US customary cubic units.
      # The international inch is exactly 2.54 cm, so one cubic inch is exactly
      # 16.387064 cm3; every larger cubic unit is chained through exact integers
      # instead of one long factor, which keeps every hop exact.
      16:
        type: "MD"
        input_unit_id: "volume_cubic_inch"
        output_unit_id: "volume_cubic_centimeter"
        formula: "x * 16.387064"
      17:
        type: "MD"
        input_unit_id: "volume_cubic_inch"
        output_unit_id: "volume_cubic_foot"
        formula: "x / 1728"
      18:
        type: "MD"
        input_unit_id: "volume_cubic_foot"
        output_unit_id: "volume_cubic_yard"
        formula: "x / 27"
      19:
        # 1 mi = 1760 yd exactly, so 1 mi3 = 1760^3 yd3.
        type: "MD"
        input_unit_id: "volume_cubic_yard"
        output_unit_id: "volume_cubic_mile"
        formula: "x / 5451776000"
      20:
        # 1 acre-foot = 43560 ft2 x 1 ft = 75271680 in3 exactly.
        type: "MD"
        input_unit_id: "volume_acre_foot"
        output_unit_id: "volume_cubic_inch"
        formula: "x * 75271680"

      # US customary liquid units - the US liquid gallon is exactly 231 in3.
      21:
        type: "MD"
        input_unit_id: "volume_us_gallon"
        output_unit_id: "volume_cubic_inch"
        formula: "x * 231"
      22:
        type: "MD"
        input_unit_id: "volume_us_gallon"
        output_unit_id: "volume_us_quart"
        formula: "x * 4"
      23:
        type: "MD"
        input_unit_id: "volume_us_quart"
        output_unit_id: "volume_us_pint"
        formula: "x * 2"
      24:
        type: "MD"
        input_unit_id: "volume_us_pint"
        output_unit_id: "volume_us_cup"
        formula: "x * 2"
      25:
        type: "MD"
        input_unit_id: "volume_us_cup"
        output_unit_id: "volume_us_fluid_ounce"
        formula: "x * 8"
      26:
        type: "MD"
        input_unit_id: "volume_us_fluid_ounce"
        output_unit_id: "volume_us_tablespoon"
        formula: "x * 2"
      27:
        type: "MD"
        input_unit_id: "volume_us_tablespoon"
        output_unit_id: "volume_us_teaspoon"
        formula: "x * 3"
      28:
        type: "MD"
        input_unit_id: "volume_us_gill"
        output_unit_id: "volume_us_fluid_ounce"
        formula: "x * 4"
      29:
        # 1 petroleum barrel = 42 US liquid gallons exactly.
        type: "MD"
        input_unit_id: "volume_petroleum_barrel"
        output_unit_id: "volume_us_gallon"
        formula: "x * 42"

      # US customary dry units - the US dry gallon is exactly 268.8025 in3.
      30:
        type: "MD"
        input_unit_id: "volume_us_dry_gallon"
        output_unit_id: "volume_cubic_inch"
        formula: "x * 268.8025"
      31:
        type: "MD"
        input_unit_id: "volume_us_dry_gallon"
        output_unit_id: "volume_us_dry_quart"
        formula: "x * 4"
      32:
        type: "MD"
        input_unit_id: "volume_us_dry_quart"
        output_unit_id: "volume_us_dry_pint"
        formula: "x * 2"

      # Imperial liquid units - the imperial gallon is legally exactly 4.54609 L.
      33:
        type: "MD"
        input_unit_id: "volume_imperial_gallon"
        output_unit_id: "volume_liter"
        formula: "x * 4.54609"
      34:
        type: "MD"
        input_unit_id: "volume_imperial_gallon"
        output_unit_id: "volume_imperial_quart"
        formula: "x * 4"
      35:
        type: "MD"
        input_unit_id: "volume_imperial_quart"
        output_unit_id: "volume_imperial_pint"
        formula: "x * 2"
      36:
        type: "MD"
        input_unit_id: "volume_imperial_pint"
        output_unit_id: "volume_imperial_gill"
        formula: "x * 4"
      37:
        type: "MD"
        input_unit_id: "volume_imperial_gill"
        output_unit_id: "volume_imperial_fluid_ounce"
        formula: "x * 5"
      38:
        type: "MD"
        input_unit_id: "volume_imperial_fluid_ounce"
        output_unit_id: "volume_imperial_fluid_dram"
        formula: "x * 8"

      # The US spoon measures also get a direct milliliter definition (exact:
      # 1 US fl oz = 231/128 in3 = 29.5735295625 mL, so 1 tbsp = 14.78676478125 mL
      # and 1 tsp = 4.92892159375 mL). Without it a route from a spoon measure to
      # a metric one has to divide by 3 first, which cannot be written exactly in
      # decimal; the direct hop keeps every such route exact.
      39:
        type: "MD"
        input_unit_id: "volume_us_tablespoon"
        output_unit_id: "volume_milliliter"
        formula: "x * 14.78676478125"
      40:
        type: "MD"
        input_unit_id: "volume_us_teaspoon"
        output_unit_id: "volume_milliliter"
        formula: "x * 4.92892159375"

      # Australian and older British spoon measures, defined straight in
      # milliliters: the Australian and New Zealand tablespoon is 20 mL (the
      # metric tablespoon of every other country is 15 mL) and the dessertspoon
      # of older British and Australian cookbooks is 10 mL. Both are exact
      # integers of milliliters, so no route through them needs a rounded factor.
      41:
        type: "MD"
        input_unit_id: "volume_australian_tablespoon"
        output_unit_id: "volume_milliliter"
        formula: "x * 20"
      42:
        type: "MD"
        input_unit_id: "volume_dessert_spoon"
        output_unit_id: "volume_milliliter"
        formula: "x * 10"

      # The gas-industry trade measure: 1 ccf is exactly 100 ft3, so it hangs off
      # the cubic foot by an exact integer and every route through it (1 ccf =
      # 2831684.6592 cm3) stays exact.
      43:
        type: "MD"
        input_unit_id: "volume_ccf"
        output_unit_id: "volume_cubic_foot"
        formula: "x * 100"

  - name: "Area Conversion"
    icon: "ft.Icons.ASPECT_RATIO"
    description: "Convert between square meters, square feet, acres, hectares, etc."
    formulas:
      # Metric square units - each hop is the square of the length hop, so the
      # factor is a power of ten and exact by definition of the SI prefixes.
      1:
        type: "MD"
        input_unit_id: "area_square_millimeter"
        output_unit_id: "area_square_centimeter"
        formula: "x / 100"
      2:
        type: "MD"
        input_unit_id: "area_square_centimeter"
        output_unit_id: "area_square_decimeter"
        formula: "x / 100"
      3:
        type: "MD"
        input_unit_id: "area_square_decimeter"
        output_unit_id: "area_square_meter"
        formula: "x / 100"
      4:
        type: "MD"
        input_unit_id: "area_square_meter"
        output_unit_id: "area_square_kilometer"
        formula: "x / 1000000"
      5:
        type: "MD"
        input_unit_id: "area_square_micrometer"
        output_unit_id: "area_square_millimeter"
        formula: "x / 1000000"

      # Metric land units - the are is exactly 100 m2 and the hectare exactly
      # 100 a, so both hops are powers of ten as well.
      6:
        type: "MD"
        input_unit_id: "area_square_meter"
        output_unit_id: "area_are"
        formula: "x / 100"
      7:
        type: "MD"
        input_unit_id: "area_are"
        output_unit_id: "area_hectare"
        formula: "x / 100"

      # The bridge to the customary units - 1 in = 25.4 mm exactly, so
      # 1 in2 = 0.00064516 m2 exactly. Dividing by that literal is exact, and so
      # is the walk of this edge backwards, which multiplies by it.
      8:
        type: "MD"
        input_unit_id: "area_square_meter"
        output_unit_id: "area_square_inch"
        formula: "x / 0.00064516"

      # Imperial / US customary square units - every hop is an exact integer, and
      # the group is a tree, so a route that has to divide by one of these is a
      # route whose own factor is not a decimal either. Nothing here is rounded.
      9:
        type: "MD"
        input_unit_id: "area_square_inch"
        output_unit_id: "area_square_foot"
        formula: "x / 144"
      10:
        type: "MD"
        input_unit_id: "area_square_foot"
        output_unit_id: "area_square_yard"
        formula: "x / 9"
      11:
        type: "MD"
        input_unit_id: "area_square_yard"
        output_unit_id: "area_square_mile"
        formula: "x / 3097600"
      12:
        type: "MD"
        input_unit_id: "area_square_yard"
        output_unit_id: "area_acre"
        formula: "x / 4840"

      # Land measures, chained away from the yard so no hop needs the repeating
      # 30.25 sq rod per sq yard: 1 acre = 4 rood and 1 rood = 40 sq rod.
      13:
        type: "MD"
        input_unit_id: "area_acre"
        output_unit_id: "area_rood"
        formula: "x * 4"
      14:
        type: "MD"
        input_unit_id: "area_rood"
        output_unit_id: "area_square_rod"
        formula: "x * 40"

  - name: "Weight Conversion"
    icon: "ft.Icons.BALANCE"
    description: "Convert between grams, kilograms, pounds, ounces, tons, carats, etc."
    formulas:
      # Metric units - exact by definition of the SI prefixes.
      1:
        type: "MD"
        input_unit_id: "weight_microgram"
        output_unit_id: "weight_milligram"
        formula: "x / 1000"
      2:
        type: "MD"
        input_unit_id: "weight_milligram"
        output_unit_id: "weight_gram"
        formula: "x / 1000"
      3:
        type: "MD"
        input_unit_id: "weight_gram"
        output_unit_id: "weight_kilogram"
        formula: "x / 1000"
      4:
        type: "MD"
        input_unit_id: "weight_kilogram"
        output_unit_id: "weight_tonne"
        formula: "x / 1000"
      5:
        type: "MD"
        input_unit_id: "weight_kilogram"
        output_unit_id: "weight_quintal"
        formula: "x / 100"
      6:
        # 1 metric carat = 0.2 g exactly.
        type: "MD"
        input_unit_id: "weight_gram"
        output_unit_id: "weight_carat"
        formula: "x * 5"

      # Avoirdupois units - since the 1959 international yard and pound
      # agreement the pound is defined as exactly 0.45359237 kg, and the grain
      # as exactly 1/7000 lb, i.e. exactly 0.00006479891 kg. Both bridges are
      # written as exact decimal factors so no hop needs a rounded division.
      7:
        type: "MD"
        input_unit_id: "weight_pound"
        output_unit_id: "weight_kilogram"
        formula: "x * 0.45359237"
      8:
        type: "MD"
        input_unit_id: "weight_grain"
        output_unit_id: "weight_kilogram"
        formula: "x * 0.00006479891"
      9:
        type: "MD"
        input_unit_id: "weight_pound"
        output_unit_id: "weight_ounce"
        formula: "x * 16"
      10:
        type: "MD"
        input_unit_id: "weight_ounce"
        output_unit_id: "weight_dram"
        formula: "x * 16"
      11:
        type: "MD"
        input_unit_id: "weight_pound"
        output_unit_id: "weight_stone"
        formula: "x / 14"
      12:
        # 1 US short hundredweight = 100 lb exactly.
        type: "MD"
        input_unit_id: "weight_pound"
        output_unit_id: "weight_hundredweight_short"
        formula: "x / 100"
      13:
        type: "MD"
        input_unit_id: "weight_hundredweight_short"
        output_unit_id: "weight_short_ton"
        formula: "x / 20"
      14:
        # 1 imperial long hundredweight = 112 lb exactly.
        type: "MD"
        input_unit_id: "weight_pound"
        output_unit_id: "weight_hundredweight_long"
        formula: "x / 112"
      15:
        type: "MD"
        input_unit_id: "weight_hundredweight_long"
        output_unit_id: "weight_long_ton"
        formula: "x / 20"

      # Troy units - 1 pennyweight = 24 gr, 1 oz t = 20 dwt, 1 lb t = 12 oz t.
      16:
        type: "MD"
        input_unit_id: "weight_grain"
        output_unit_id: "weight_pennyweight"
        formula: "x / 24"
      17:
        type: "MD"
        input_unit_id: "weight_pennyweight"
        output_unit_id: "weight_troy_ounce"
        formula: "x / 20"
      18:
        type: "MD"
        input_unit_id: "weight_troy_ounce"
        output_unit_id: "weight_troy_pound"
        formula: "x / 12"

      # Apothecaries' units - 1 ap dr = 3 s, 1 ap oz = 8 ap dr, 1 ap lb = 12 ap oz,
      # so 1 ap oz = 480 gr, the same mass as the troy ounce.
      19:
        type: "MD"
        input_unit_id: "weight_grain"
        output_unit_id: "weight_scruple"
        formula: "x / 20"
      20:
        type: "MD"
        input_unit_id: "weight_scruple"
        output_unit_id: "weight_apothecaries_dram"
        formula: "x / 3"
      21:
        type: "MD"
        input_unit_id: "weight_apothecaries_dram"
        output_unit_id: "weight_apothecaries_ounce"
        formula: "x / 8"
      22:
        type: "MD"
        input_unit_id: "weight_apothecaries_ounce"
        output_unit_id: "weight_apothecaries_pound"
        formula: "x / 12"

  - name: "Energy Conversion"
    icon: "ft.Icons.BOLT"
    description: "Convert between joules, calories, kilowatt-hours, BTU, therms, etc."
    formulas:
      # Metric units - exact by definition of the SI prefixes, and one erg is
      # exactly 1e-7 J.
      1:
        type: "MD"
        input_unit_id: "energy_joule"
        output_unit_id: "energy_kilojoule"
        formula: "x / 1000"
      2:
        type: "MD"
        input_unit_id: "energy_kilojoule"
        output_unit_id: "energy_megajoule"
        formula: "x / 1000"
      3:
        type: "MD"
        input_unit_id: "energy_megajoule"
        output_unit_id: "energy_gigajoule"
        formula: "x / 1000"
      4:
        type: "MD"
        input_unit_id: "energy_erg"
        output_unit_id: "energy_joule"
        formula: "x / 10000000"

      # The three legal calories, each an exact number of joules: the International
      # Table calorie (4.1868 J), the thermochemical calorie (4.184 J) and the
      # 15 C calorie (4.1855 J). The kilocalorie is a thousand IT calories, so its
      # hop is an exact integer.
      5:
        type: "MD"
        input_unit_id: "energy_calorie_it"
        output_unit_id: "energy_joule"
        formula: "x * 4.1868"
      6:
        type: "MD"
        input_unit_id: "energy_kilocalorie_it"
        output_unit_id: "energy_calorie_it"
        formula: "x * 1000"
      7:
        type: "MD"
        input_unit_id: "energy_calorie_th"
        output_unit_id: "energy_joule"
        formula: "x * 4.184"
      8:
        type: "MD"
        input_unit_id: "energy_calorie_15"
        output_unit_id: "energy_joule"
        formula: "x * 4.1855"

      # Electrical units - a watt is a joule per second and an hour is 3600 s, so
      # one watt-hour is exactly 3600 J and the SI prefixes above it are integers.
      9:
        type: "MD"
        input_unit_id: "energy_watt_hour"
        output_unit_id: "energy_joule"
        formula: "x * 3600"
      10:
        type: "MD"
        input_unit_id: "energy_kilowatt_hour"
        output_unit_id: "energy_watt_hour"
        formula: "x * 1000"
      11:
        type: "MD"
        input_unit_id: "energy_megawatt_hour"
        output_unit_id: "energy_kilowatt_hour"
        formula: "x * 1000"

      # The International Table Btu is legally exactly 1055.05585262 J, so the therm
      # (100 000 Btu) and the quad (1e15 Btu) are reached by exact integers instead
      # of one long decimal - the quad alone would be a 19-digit factor.
      12:
        type: "MD"
        input_unit_id: "energy_btu_it"
        output_unit_id: "energy_joule"
        formula: "x * 1055.05585262"
      13:
        type: "MD"
        input_unit_id: "energy_therm"
        output_unit_id: "energy_btu_it"
        formula: "x * 100000"
      14:
        type: "MD"
        input_unit_id: "energy_quad"
        output_unit_id: "energy_btu_it"
        formula: "x * 1000000000000000"

      # Mechanical units - the foot-pound-force is one pound-force (exactly
      # 4.4482216152605 N, from the 1959 pound and standard gravity) acting through
      # one foot (exactly 0.3048 m). Writing it as that product keeps every literal
      # inside the 15 significant digits the engine parses; the single equivalent
      # decimal, 1.3558179483314004, would not fit. A mechanical horsepower is
      # 550 ft-lbf per second, so one hour of it is exactly 1980000 ft-lbf.
      15:
        type: "MD"
        input_unit_id: "energy_foot_pound_force"
        output_unit_id: "energy_joule"
        formula: "x * 4.4482216152605 * 0.3048"
      16:
        type: "MD"
        input_unit_id: "energy_horsepower_hour"
        output_unit_id: "energy_foot_pound_force"
        formula: "x * 1980000"

      # The thermochemical Btu is the heat for 1 lb of water per 1 F, i.e.
      # 453.59237 g x 5/9 x 4.184 J. The 5/9 leaves a repeating decimal
      # (1054.3502644888...), so this is the one Energy factor that cannot be
      # written exactly; the literal carries the 15 significant digits the engine
      # can parse, which puts it within 2e-11 J of the defined value.
      17:
        type: "MD"
        input_unit_id: "energy_btu_th"
        output_unit_id: "energy_joule"
        formula: "x * 1054.35026448889"

      # The electronvolt has been exact since the 2019 SI: the elementary charge is
      # defined as 1.602176634e-19 C, so 1 eV is exactly 1.602176634e-19 J.
      18:
        type: "MD"
        input_unit_id: "energy_electronvolt"
        output_unit_id: "energy_joule"
        formula: "x * 1.602176634e-19"

  - name: "Force Conversion"
    icon: "ft.Icons.FITNESS_CENTER"
    description: "Convert between newtons, pound-force, kilogram-force, dynes, kips, etc."
    formulas:
      # Metric units - the newton is kg x m/s2, so the SI prefixes are exact and one
      # dyne is exactly 1e-5 N.
      1:
        type: "MD"
        input_unit_id: "force_newton"
        output_unit_id: "force_kilonewton"
        formula: "x / 1000"
      2:
        type: "MD"
        input_unit_id: "force_kilonewton"
        output_unit_id: "force_meganewton"
        formula: "x / 1000"
      3:
        type: "MD"
        input_unit_id: "force_dyne"
        output_unit_id: "force_newton"
        formula: "x / 100000"

      # Gravitational metric units - kilogram-force is the weight of a kilogram in
      # standard gravity, which is defined as exactly 9.80665 m/s2. The gram-force
      # and the tonne-force are a thousandth and a thousand of it, so only one hop
      # carries a decimal at all.
      4:
        type: "MD"
        input_unit_id: "force_kilogram_force"
        output_unit_id: "force_newton"
        formula: "x * 9.80665"
      5:
        type: "MD"
        input_unit_id: "force_gram_force"
        output_unit_id: "force_kilogram_force"
        formula: "x / 1000"
      6:
        type: "MD"
        input_unit_id: "force_tonne_force"
        output_unit_id: "force_kilogram_force"
        formula: "x * 1000"

      # Imperial / US customary units - since the 1959 yard-and-pound agreement the
      # pound is exactly 0.45359237 kg, so one pound-force is exactly
      # 0.45359237 x 9.80665 = 4.4482216152605 N and one poundal is exactly
      # 0.45359237 x 0.3048 = 0.138254954376 N. Both bridges are exact decimals, so
      # no hop through them needs rounding.
      7:
        type: "MD"
        input_unit_id: "force_pound_force"
        output_unit_id: "force_newton"
        formula: "x * 4.4482216152605"
      8:
        # 1 lbf = 16 ozf exactly.
        type: "MD"
        input_unit_id: "force_ounce_force"
        output_unit_id: "force_pound_force"
        formula: "x / 16"
      9:
        # 1 kip = 1000 lbf, the US structural engineering shorthand.
        type: "MD"
        input_unit_id: "force_kip"
        output_unit_id: "force_pound_force"
        formula: "x * 1000"
      10:
        # 1 short ton-force = 2000 lbf exactly.
        type: "MD"
        input_unit_id: "force_pound_force"
        output_unit_id: "force_short_ton_force"
        formula: "x / 2000"
      11:
        # 1 long ton-force = 2240 lbf exactly.
        type: "MD"
        input_unit_id: "force_pound_force"
        output_unit_id: "force_long_ton_force"
        formula: "x / 2240"
      12:
        type: "MD"
        input_unit_id: "force_poundal"
        output_unit_id: "force_newton"
        formula: "x * 0.138254954376"

  - name: "Speed Conversion"
    icon: "ft.Icons.SPEED"
    description: "Convert between metres per second, kilometres per hour, miles per hour, knots, feet per second, etc."
    formulas:
      # Metric speeds - the SI prefixes are exact, and an hour is exactly 3600
      # seconds, so one kilometre per second is exactly 3600 kilometres per hour.
      1:
        type: "MD"
        input_unit_id: "speed_millimeter_per_second"
        output_unit_id: "speed_centimeter_per_second"
        formula: "x / 10"
      2:
        type: "MD"
        input_unit_id: "speed_centimeter_per_second"
        output_unit_id: "speed_meter_per_second"
        formula: "x / 100"
      3:
        type: "MD"
        input_unit_id: "speed_meter_per_second"
        output_unit_id: "speed_kilometer_per_second"
        formula: "x / 1000"
      4:
        type: "MD"
        input_unit_id: "speed_kilometer_per_second"
        output_unit_id: "speed_kilometer_per_hour"
        formula: "x * 3600"

      # Imperial / US customary - the 1959 yard-and-pound agreement fixes the mile
      # at 1609.344 m and the foot at 0.3048 m, so a mile per hour is exactly
      # 1.609344 km/h and a foot per second exactly 0.3048 m/s. The smaller units
      # are whole divisions of those.
      5:
        type: "MD"
        input_unit_id: "speed_mile_per_hour"
        output_unit_id: "speed_kilometer_per_hour"
        formula: "x * 1.609344"
      6:
        type: "MD"
        input_unit_id: "speed_foot_per_second"
        output_unit_id: "speed_meter_per_second"
        formula: "x * 0.3048"
      7:
        type: "MD"
        input_unit_id: "speed_foot_per_minute"
        output_unit_id: "speed_foot_per_second"
        formula: "x / 60"
      8:
        type: "MD"
        input_unit_id: "speed_inch_per_second"
        output_unit_id: "speed_foot_per_second"
        formula: "x / 12"
      9:
        type: "MD"
        input_unit_id: "speed_inch_per_minute"
        output_unit_id: "speed_inch_per_second"
        formula: "x / 60"

      # The knot is one nautical mile per hour and the international nautical mile
      # is exactly 1852 m, so one knot is exactly 1.852 km/h.
      10:
        type: "MD"
        input_unit_id: "speed_knot"
        output_unit_id: "speed_kilometer_per_hour"
        formula: "x * 1.852"

      # Since 1983 the metre is defined through c, so the speed of light is exactly
      # 299792458 m/s - exactly 299792.458 km/s.
      11:
        type: "MD"
        input_unit_id: "speed_light"
        output_unit_id: "speed_kilometer_per_second"
        formula: "x * 299792.458"

      # A furlong is 660 ft, exactly 201.168 m, and a fortnight exactly 14 days,
      # 1209600 s. Chained rather than written as one factor: the quotient repeats.
      12:
        type: "MD"
        input_unit_id: "speed_furlong_per_fortnight"
        output_unit_id: "speed_meter_per_second"
        formula: "x * 201.168 / 1209600"

  - name: "Pressure Conversion"
    icon: "ft.Icons.DASHBOARD"
    description: "Convert between pascals, bar, psi, atmospheres, torr, mmHg, inches of water, etc."
    formulas:
      # Metric pressures - the SI prefixes are exact.
      1:
        type: "MD"
        input_unit_id: "pressure_pascal"
        output_unit_id: "pressure_hectopascal"
        formula: "x / 100"
      2:
        type: "MD"
        input_unit_id: "pressure_hectopascal"
        output_unit_id: "pressure_kilopascal"
        formula: "x / 10"
      3:
        type: "MD"
        input_unit_id: "pressure_kilopascal"
        output_unit_id: "pressure_megapascal"
        formula: "x / 1000"
      4:
        type: "MD"
        input_unit_id: "pressure_megapascal"
        output_unit_id: "pressure_gigapascal"
        formula: "x / 1000"

      # The bar is defined as exactly 100000 Pa, so exactly 100 kPa; a millibar is a
      # thousandth of a bar and therefore exactly the same size as a hectopascal.
      5:
        type: "MD"
        input_unit_id: "pressure_bar"
        output_unit_id: "pressure_kilopascal"
        formula: "x * 100"
      6:
        type: "MD"
        input_unit_id: "pressure_millibar"
        output_unit_id: "pressure_bar"
        formula: "x / 1000"

      # The standard atmosphere is defined as exactly 101325 Pa and the torr as
      # exactly 1/760 of it. The torr is chained through those two integers because
      # 101325/760 has no exact decimal.
      7:
        type: "MD"
        input_unit_id: "pressure_standard_atmosphere"
        output_unit_id: "pressure_kilopascal"
        formula: "x * 101.325"
      8:
        type: "MD"
        input_unit_id: "pressure_torr"
        output_unit_id: "pressure_pascal"
        formula: "x * 101325 / 760"

      # The conventional mercury column is the convention NIST prints: a column of
      # mercury of 13595.1 kg/m3 under standard gravity, which is exactly
      # 9.80665 m/s2. One millimetre of it is exactly 133.322387415 Pa, and an inch
      # of it is 25.4 millimetres of it.
      9:
        type: "MD"
        input_unit_id: "pressure_millimeter_mercury"
        output_unit_id: "pressure_pascal"
        formula: "x * 133.322387415"
      10:
        type: "MD"
        input_unit_id: "pressure_inch_mercury"
        output_unit_id: "pressure_millimeter_mercury"
        formula: "x * 25.4"

      # psi is one pound-force (exactly 4.4482216152605 N, the 1959 pound under
      # standard gravity) on one square inch (exactly 0.00064516 m2). The single
      # equivalent decimal, 6894.757293168361..., repeats and is past what the engine
      # parses anyway, so the hop keeps both exact factors and divides on through to
      # kilopascals; reversing it multiplies by each in turn.
      11:
        type: "MD"
        input_unit_id: "pressure_psi"
        output_unit_id: "pressure_kilopascal"
        formula: "x * 4.4482216152605 / 0.00064516 / 1000"
      12:
        # 1 ft2 = 144 in2 exactly.
        type: "MD"
        input_unit_id: "pressure_pound_per_square_foot"
        output_unit_id: "pressure_psi"
        formula: "x / 144"

      # The technical atmosphere: one kilogram-force (exactly 9.80665 N) on one
      # square centimetre is exactly 98066.5 Pa, so exactly 98.0665 kPa.
      13:
        type: "MD"
        input_unit_id: "pressure_kilogram_force_per_square_centimeter"
        output_unit_id: "pressure_kilopascal"
        formula: "x * 98.0665"

      # The conventional water column: water of 1000 kg/m3 under the same standard
      # gravity, so one millimetre of it is exactly 9.80665 Pa.
      14:
        type: "MD"
        input_unit_id: "pressure_millimeter_water"
        output_unit_id: "pressure_pascal"
        formula: "x * 9.80665"
      15:
        type: "MD"
        input_unit_id: "pressure_centimeter_water"
        output_unit_id: "pressure_millimeter_water"
        formula: "x * 10"
      16:
        type: "MD"
        input_unit_id: "pressure_inch_water"
        output_unit_id: "pressure_millimeter_water"
        formula: "x * 25.4"

  - name: "Power Conversion"
    icon: "ft.Icons.POWER"
    description: "Convert between watts, kilowatts, horsepower, BTU per hour, tons of refrigeration, etc."
    formulas:
      # Metric power - the SI prefixes are exact, and a volt-ampere is apparent
      # power: numerically one watt, so the hop goes on to the milliwatt rather than
      # carrying a literal 1.
      1:
        type: "MD"
        input_unit_id: "power_milliwatt"
        output_unit_id: "power_watt"
        formula: "x / 1000"
      2:
        type: "MD"
        input_unit_id: "power_watt"
        output_unit_id: "power_kilowatt"
        formula: "x / 1000"
      3:
        type: "MD"
        input_unit_id: "power_kilowatt"
        output_unit_id: "power_megawatt"
        formula: "x / 1000"
      4:
        type: "MD"
        input_unit_id: "power_megawatt"
        output_unit_id: "power_gigawatt"
        formula: "x / 1000"
      5:
        type: "MD"
        input_unit_id: "power_gigawatt"
        output_unit_id: "power_terawatt"
        formula: "x / 1000"
      6:
        type: "MD"
        input_unit_id: "power_volt_ampere"
        output_unit_id: "power_milliwatt"
        formula: "x * 1000"

      # CGS - one erg is exactly 1e-7 J.
      7:
        type: "MD"
        input_unit_id: "power_erg_per_second"
        output_unit_id: "power_watt"
        formula: "x / 10000000"

      # The foot-pound-force per second is one pound-force (exactly
      # 4.4482216152605 N) through one foot (exactly 0.3048 m) every second, and the
      # mechanical horsepower is exactly 550 of them - the same two-literal form the
      # Energy group uses, because the single equivalent decimal is too long.
      8:
        type: "MD"
        input_unit_id: "power_foot_pound_force_per_second"
        output_unit_id: "power_watt"
        formula: "x * 4.4482216152605 * 0.3048"
      9:
        type: "MD"
        input_unit_id: "power_horsepower_mechanical"
        output_unit_id: "power_foot_pound_force_per_second"
        formula: "x * 550"

      # The metric horsepower is exactly 75 kilogram-force metres per second, and
      # kilogram-force is exactly 9.80665 N, so it is exactly 735.49875 W. The
      # electric horsepower is defined as exactly 746 W.
      10:
        type: "MD"
        input_unit_id: "power_horsepower_metric"
        output_unit_id: "power_watt"
        formula: "x * 735.49875"
      11:
        type: "MD"
        input_unit_id: "power_horsepower_electric"
        output_unit_id: "power_watt"
        formula: "x * 746"

      # Heat rates - the International Table Btu is exactly 1055.05585262 J and an
      # hour exactly 3600 s, the IT calorie exactly 4.1868 J. A refrigeration ton is
      # exactly 12000 Btu (IT) per hour and a boiler horsepower exactly 33475 of them.
      # Each hop is chained through exact integers; only the /3600 steps repeat.
      12:
        type: "MD"
        input_unit_id: "power_btu_per_hour"
        output_unit_id: "power_watt"
        formula: "x * 1055.05585262 / 3600"
      13:
        type: "MD"
        input_unit_id: "power_ton_of_refrigeration"
        output_unit_id: "power_btu_per_hour"
        formula: "x * 12000"
      14:
        type: "MD"
        input_unit_id: "power_horsepower_boiler"
        output_unit_id: "power_btu_per_hour"
        formula: "x * 33475"
      15:
        type: "MD"
        input_unit_id: "power_calorie_it_per_hour"
        output_unit_id: "power_watt"
        formula: "x * 4.1868 / 3600"
      16:
        type: "MD"
        input_unit_id: "power_kilocalorie_it_per_hour"
        output_unit_id: "power_calorie_it_per_hour"
        formula: "x * 1000"

  - name: "Angle Conversion"
    icon: "ft.Icons.ROTATE_90_DEGREES_CW"
    description: "Convert between degrees, radians, gradians, arcminutes, turns, milli-radians, etc."
    formulas:
      # Every customary and metric angle here is an exact fraction of a turn: 360
      # degrees, 400 gradians, 32 compass points, 6400 NATO mils and 24 hours of
      # right ascension to the circle, 60 arcminutes and 60 arcseconds to the degree.
      1:
        type: "MD"
        input_unit_id: "angle_degree"
        output_unit_id: "angle_arcminute"
        formula: "x * 60"
      2:
        type: "MD"
        input_unit_id: "angle_arcminute"
        output_unit_id: "angle_arcsecond"
        formula: "x * 60"
      3:
        type: "MD"
        input_unit_id: "angle_degree"
        output_unit_id: "angle_gradian"
        formula: "x * 400 / 360"
      4:
        type: "MD"
        input_unit_id: "angle_turn"
        output_unit_id: "angle_degree"
        formula: "x * 360"
      5:
        type: "MD"
        input_unit_id: "angle_compass_point"
        output_unit_id: "angle_turn"
        formula: "x / 32"
      6:
        type: "MD"
        input_unit_id: "angle_nato_mil"
        output_unit_id: "angle_turn"
        formula: "x / 6400"
      7:
        type: "MD"
        input_unit_id: "angle_hour_angle"
        output_unit_id: "angle_degree"
        formula: "x * 15"

      # A radian is 180/pi degrees, which has no decimal expansion at all, so the hop
      # carries pi itself and the app's own computed pi does the work - adopting a
      # longer pi on the Pi page makes these hops more accurate. Both directions are
      # spelled out (UD, as the parsec hops are), because reversing a formula has to
      # evaluate its constant part without the scientific constants table.
      8:
        type: "UD"
        input_unit_id: "angle_radian"
        output_unit_id: "angle_degree"
        formula: "x * (180 / pi)"
      9:
        type: "UD"
        input_unit_id: "angle_degree"
        output_unit_id: "angle_radian"
        formula: "x / (180 / pi)"
      10:
        type: "MD"
        input_unit_id: "angle_milliradian"
        output_unit_id: "angle_radian"
        formula: "x / 1000"

  - name: "Data Rate Conversion"
    icon: "ft.Icons.DOWNLOAD"
    description: "Convert between bits per second, bytes per second, kibibytes per second, Mbit/s, STS-1, etc."
    formulas:
      # IEC 80000-13: the decimal prefixes are powers of 1000, the binary ones powers
      # of 1024, and a byte is exactly 8 bits. Every factor here is one of those
      # exact integers.
      1:
        type: "MD"
        input_unit_id: "datarate_bit_per_second"
        output_unit_id: "datarate_kilobit_per_second"
        formula: "x / 1000"
      2:
        type: "MD"
        input_unit_id: "datarate_kilobit_per_second"
        output_unit_id: "datarate_megabit_per_second"
        formula: "x / 1000"
      3:
        type: "MD"
        input_unit_id: "datarate_megabit_per_second"
        output_unit_id: "datarate_gigabit_per_second"
        formula: "x / 1000"
      4:
        type: "MD"
        input_unit_id: "datarate_gigabit_per_second"
        output_unit_id: "datarate_terabit_per_second"
        formula: "x / 1000"
      5:
        type: "MD"
        input_unit_id: "datarate_kibibit_per_second"
        output_unit_id: "datarate_bit_per_second"
        formula: "x * 1024"
      6:
        type: "MD"
        input_unit_id: "datarate_mebibit_per_second"
        output_unit_id: "datarate_kibibit_per_second"
        formula: "x * 1024"
      7:
        type: "MD"
        input_unit_id: "datarate_gibibit_per_second"
        output_unit_id: "datarate_mebibit_per_second"
        formula: "x * 1024"
      8:
        type: "MD"
        input_unit_id: "datarate_tebibit_per_second"
        output_unit_id: "datarate_gibibit_per_second"
        formula: "x * 1024"
      9:
        type: "MD"
        input_unit_id: "datarate_byte_per_second"
        output_unit_id: "datarate_bit_per_second"
        formula: "x * 8"
      10:
        type: "MD"
        input_unit_id: "datarate_kilobyte_per_second"
        output_unit_id: "datarate_byte_per_second"
        formula: "x * 1000"
      11:
        type: "MD"
        input_unit_id: "datarate_megabyte_per_second"
        output_unit_id: "datarate_kilobyte_per_second"
        formula: "x * 1000"
      12:
        type: "MD"
        input_unit_id: "datarate_gigabyte_per_second"
        output_unit_id: "datarate_megabyte_per_second"
        formula: "x * 1000"
      13:
        type: "MD"
        input_unit_id: "datarate_terabyte_per_second"
        output_unit_id: "datarate_gigabyte_per_second"
        formula: "x * 1000"
      14:
        type: "MD"
        input_unit_id: "datarate_kibibyte_per_second"
        output_unit_id: "datarate_kibibit_per_second"
        formula: "x * 8"
      15:
        type: "MD"
        input_unit_id: "datarate_mebibyte_per_second"
        output_unit_id: "datarate_mebibit_per_second"
        formula: "x * 8"
      16:
        type: "MD"
        input_unit_id: "datarate_gibibyte_per_second"
        output_unit_id: "datarate_gibibit_per_second"
        formula: "x * 8"
      17:
        type: "MD"
        input_unit_id: "datarate_tebibyte_per_second"
        output_unit_id: "datarate_tebibit_per_second"
        formula: "x * 8"

      # SONET: an STS-1 frame is 810 bytes sent every 125 microseconds, which is
      # exactly 51840000 bit/s, so exactly 51.84 Mbit/s. SDH's STM-1 (OC-3) is
      # exactly three STS-1 - 155.52 Mbit/s.
      18:
        type: "MD"
        input_unit_id: "datarate_sts_1"
        output_unit_id: "datarate_megabit_per_second"
        formula: "x * 51.84"
      19:
        type: "MD"
        input_unit_id: "datarate_stm_1"
        output_unit_id: "datarate_sts_1"
        formula: "x * 3"

  - name: "Mass Flow Conversion"
    icon: "ft.Icons.WATER"
    description: "Convert between kilograms per second, tonnes per hour, pounds per hour, short tons per day, etc."
    formulas:
      # Metric flows - the SI prefixes are exact, a minute is exactly 60 s, an hour
      # exactly 60 minutes and a day exactly 24 hours, so every factor here is a
      # whole-number multiplication or division.
      1:
        type: "MD"
        input_unit_id: "massflow_milligram_per_second"
        output_unit_id: "massflow_gram_per_second"
        formula: "x / 1000"
      2:
        type: "MD"
        input_unit_id: "massflow_gram_per_second"
        output_unit_id: "massflow_kilogram_per_second"
        formula: "x / 1000"
      3:
        type: "MD"
        input_unit_id: "massflow_kilogram_per_second"
        output_unit_id: "massflow_kilogram_per_minute"
        formula: "x * 60"
      4:
        type: "MD"
        input_unit_id: "massflow_kilogram_per_minute"
        output_unit_id: "massflow_kilogram_per_hour"
        formula: "x * 60"
      5:
        type: "MD"
        input_unit_id: "massflow_kilogram_per_hour"
        output_unit_id: "massflow_kilogram_per_day"
        formula: "x * 24"
      6:
        type: "MD"
        input_unit_id: "massflow_kilogram_per_second"
        output_unit_id: "massflow_tonne_per_second"
        formula: "x / 1000"
      7:
        type: "MD"
        input_unit_id: "massflow_tonne_per_second"
        output_unit_id: "massflow_tonne_per_minute"
        formula: "x * 60"
      8:
        type: "MD"
        input_unit_id: "massflow_tonne_per_minute"
        output_unit_id: "massflow_tonne_per_hour"
        formula: "x * 60"
      9:
        type: "MD"
        input_unit_id: "massflow_tonne_per_hour"
        output_unit_id: "massflow_tonne_per_day"
        formula: "x * 24"
      10:
        type: "MD"
        input_unit_id: "massflow_gram_per_minute"
        output_unit_id: "massflow_gram_per_second"
        formula: "x / 60"
      11:
        type: "MD"
        input_unit_id: "massflow_gram_per_hour"
        output_unit_id: "massflow_gram_per_minute"
        formula: "x / 60"

      # Customary flows - the 1959 yard-and-pound agreement fixes the pound at
      # exactly 0.45359237 kg, so each of these is that exact number of kilograms
      # over an exact number of seconds: an ounce is a sixteenth of a pound, a short
      # ton 2000 pounds, a long ton 2240 and a stone 14.
      12:
        type: "MD"
        input_unit_id: "massflow_pound_per_second"
        output_unit_id: "massflow_kilogram_per_second"
        formula: "x * 0.45359237"
      13:
        type: "MD"
        input_unit_id: "massflow_pound_per_minute"
        output_unit_id: "massflow_pound_per_second"
        formula: "x / 60"
      14:
        type: "MD"
        input_unit_id: "massflow_pound_per_hour"
        output_unit_id: "massflow_pound_per_minute"
        formula: "x / 60"
      15:
        type: "MD"
        input_unit_id: "massflow_ounce_per_minute"
        output_unit_id: "massflow_pound_per_minute"
        formula: "x / 16"
      16:
        type: "MD"
        input_unit_id: "massflow_short_ton_per_hour"
        output_unit_id: "massflow_pound_per_hour"
        formula: "x * 2000"
      17:
        type: "MD"
        input_unit_id: "massflow_short_ton_per_day"
        output_unit_id: "massflow_short_ton_per_hour"
        formula: "x / 24"
      18:
        type: "MD"
        input_unit_id: "massflow_long_ton_per_hour"
        output_unit_id: "massflow_pound_per_hour"
        formula: "x * 2240"
      19:
        type: "MD"
        input_unit_id: "massflow_stone_per_day"
        output_unit_id: "massflow_pound_per_hour"
        formula: "x * 14 / 24"
