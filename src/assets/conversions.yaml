        formula: "x / 1024"

      # Decimal Bit Units
      23:
        type: "MD"
        input_unit_id: "data_bit"
        output_unit_id: "data_kilobit"
        formula: "x / 1000"
      24:
        type: "MD"
        input_unit_id: "data_kilobit"
        output_unit_id: "data_megabit"
        formula: "x / 1000"
      25:
        type: "MD"
        input_unit_id: "data_megabit"
