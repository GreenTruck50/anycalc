        id: "time_month30"
      - name: "Month (31d)"
        symbol: "mo"
        id: "time_month31"
      - name: "Month (avg)"
        symbol: "mo"
        id: "time_monthavg"
      - name: "Year (non-leap)"
        symbol: "yr"
        id: "time_year"
      - name: "Year (leap)"
        symbol: "yr"
        id: "time_year_leap"
  - name: "Temperature"
    units:
      - name: "Celsius"
        symbol: "°C"
        id: "temperature_celsius"
      - name: "Fahrenheit"
        symbol: "°F"
        id: "temperature_fahrenheit"      
      - name: "Kelvin"
        symbol: "K"
        id: "temperature_kelvin"
      - name: "Rankine"
        symbol: "°R"
        id: "temperature_rankine"
  - name: "Data"
    units:
      # Basic Units
      - name: "Bit"
        symbol: "bit"
        id: "data_bit"
      - name: "Nibble"
        symbol: "nibble"
        id: "data_nibble"
      - name: "Byte"
        symbol: "B"
        id: "data_byte"

      # Decimal Bit Units (SI: powers of 1000)
      - name: "Kilobit"
        symbol: "kbit"
        id: "data_kilobit"
      - name: "Kilobyte"
        symbol: "kB"
        id: "data_kilobyte"
      - name: "Megabit"
        symbol: "Mbit"
        id: "data_megabit"
      - name: "Megabyte"
        symbol: "MB"
        id: "data_megabyte"
      - name: "Gigabit"
        symbol: "Gbit"
        id: "data_gigabit"
      - name: "Gigabyte"
        symbol: "GB"
        id: "data_gigabyte"
      - name: "Terabit"
        symbol: "Tbit"
        id: "data_terabit"
      - name: "Terabyte"
        symbol: "TB"
        id: "data_terabyte"
      - name: "Petabit"
        symbol: "Pbit"
        id: "data_petabit"
      - name: "Petabyte"
        symbol: "PB"
        id: "data_petabyte"
      - name: "Exabit"
        symbol: "Ebit"
        id: "data_exabit"
      - name: "Exabyte"
        symbol: "EB"
        id: "data_exabyte"
      - name: "Zettabit"
        symbol: "Zbit"
        id: "data_zettabit"
      - name: "Zettabyte"
        symbol: "ZB"
        id: "data_zettabyte"
      - name: "Yottabit"
        symbol: "Ybit"
        id: "data_yottabit"
      - name: "Yottabyte"
        symbol: "YB"
        id: "data_yottabyte"
      - name: "Ronnabit"
        symbol: "Rbit"
        id: "data_ronnabit"
      - name: "Ronnabyte"
        symbol: "RB"
        id: "data_ronnabyte"
      - name: "Quettabit"
        symbol: "Qbit"
        id: "data_quettabit"
      - name: "Quettabyte"
        symbol: "QB"
        id: "data_quettabyte"

      # Binary Bit Units (IEC: powers of 1024)
      - name: "Kibibit"
        symbol: "Kibit"
        id: "data_kibibit"
      - name: "Kibibyte"
        symbol: "KiB"
        id: "data_kibibyte"
      - name: "Mebibit"
        symbol: "Mibit"
        id: "data_mebibit"
      - name: "Mebibyte"
        symbol: "MiB"
        id: "data_mebibyte"
      - name: "Gibibit"
        symbol: "Gibit"
        id: "data_gibibit"
      - name: "Gibibyte"
        symbol: "GiB"
        id: "data_gibibyte"
      - name: "Tebibit"
        symbol: "Tibit"
        id: "data_tebibit"
      - name: "Tebibyte"
        symbol: "TiB"
        id: "data_tebibyte"
      - name: "Pebibit"
        symbol: "Pibit"
        id: "data_pebibit"
      - name: "Pebibyte"
        symbol: "PiB"
        id: "data_pebibyte"
      - name: "Exbibit"
        symbol: "Eibit"
        id: "data_exbibit"
      - name: "Exbibyte"
        symbol: "EiB"
        id: "data_exbibyte"
      - name: "Zebibit"
        symbol: "Zibit"
        id: "data_zebibit"
      - name: "Zebibyte"
        symbol: "ZiB"
        id: "data_zebibyte"
      - name: "Yobibit"
        symbol: "Yibit"
        id: "data_yobibit"
      - name: "Yobibyte"
        symbol: "YiB"
        id: "data_yobibyte"
      - name: "Robibit"
        symbol: "Ribit"
        id: "data_robibit"
      - name: "Robibyte"
        symbol: "RiB"
        id: "data_robibyte"
      - name: "Quebibit"
        symbol: "Qibit"
        id: "data_quebibit"
      - name: "Quebibyte"
        symbol: "QiB"
        id: "data_quebibyte"
  - name: "Volume"
    units:
      # Metric cubic units
      - name: "Cubic Millimeter"
        symbol: "mm³"
        id: "volume_cubic_millimeter"
        guidance: "Exactly 1 µL - a metric cubic for packaging and medicine, not a spoon a recipe means."
      - name: "Cubic Centimeter"
        symbol: "cm³"
        id: "volume_cubic_centimeter"
        guidance: "Exactly 1 mL - the cubic printed on packaging and syringes."
      - name: "Cubic Decimeter"
        symbol: "dm³"
        id: "volume_cubic_decimeter"
      - name: "Cubic Meter"
        symbol: "m³"
        id: "volume_cubic_meter"
      - name: "Cubic Kilometer"
        symbol: "km³"
        id: "volume_cubic_kilometer"

      # Imperial / US customary cubic units
      - name: "Cubic Inch"
        symbol: "in³"
        id: "volume_cubic_inch"
      - name: "Cubic Foot"
        symbol: "ft³"
        id: "volume_cubic_foot"
      - name: "Hundred Cubic Feet"
        symbol: "ccf"
        id: "volume_ccf"
        guidance: "100 ft³ - the unit a natural-gas bill is written in; roughly the heat of one therm."
      - name: "Cubic Yard"
        symbol: "yd³"
        id: "volume_cubic_yard"
      - name: "Cubic Mile"
        symbol: "mi³"
        id: "volume_cubic_mile"
      - name: "Acre-Foot"
        symbol: "acre-ft"
        id: "volume_acre_foot"

      # Metric liquid units
      - name: "Microliter"
        symbol: "μL"
        id: "volume_microliter"
      - name: "Milliliter"
        symbol: "mL"
        id: "volume_milliliter"
      - name: "Centiliter"
        symbol: "cL"
        id: "volume_centiliter"
      - name: "Deciliter"
        symbol: "dL"
        id: "volume_deciliter"
      - name: "Liter"
        symbol: "L"
        id: "volume_liter"
      - name: "Hectoliter"
        symbol: "hL"
        id: "volume_hectoliter"
      - name: "Kiloliter"
        symbol: "kL"
        id: "volume_kiloliter"

      # Culinary metric units (defined in milliliters)
      - name: "Teaspoon (metric)"
        symbol: "tsp"
        id: "volume_metric_teaspoon"
        guidance: "The 5 mL spoon of Australia, the UK, Canada and most metric cookbooks."
      - name: "Tablespoon (metric, 15 mL)"
        symbol: "tbsp"
        id: "volume_metric_tablespoon"
        guidance: "15 mL - the tablespoon of UK, Canadian and most metric recipes. Australian and New Zealand recipes mean 20 mL."
      - name: "Tablespoon (Australia, 20 mL)"
        symbol: "tbsp"
        id: "volume_australian_tablespoon"
        guidance: "20 mL - the Australian and New Zealand tablespoon, four teaspoons. Using 15 mL flattens an Australian recipe."
      - name: "Dessertspoon (10 mL)"
        symbol: "dsp"
        id: "volume_dessert_spoon"
        guidance: "10 mL - the spoon between a teaspoon and a tablespoon, still written into older British and Australian cookbooks."
      - name: "Cup (metric, 250 mL)"
        symbol: "cup"
        id: "volume_metric_cup"
        guidance: "250 mL - the cup of Australia, New Zealand, the UK and Canada."

      # US customary liquid units
      - name: "Teaspoon (US)"
        symbol: "tsp"
        id: "volume_us_teaspoon"
        guidance: "4.93 mL - the US teaspoon; a metric teaspoon is 5 mL, close enough to use."
      - name: "Tablespoon (US)"
        symbol: "tbsp"
        id: "volume_us_tablespoon"
        guidance: "14.8 mL - the US tablespoon, half a US fluid ounce."
      - name: "Fluid Ounce (US)"
        symbol: "fl oz"
        id: "volume_us_fluid_ounce"
        guidance: "29.6 mL - the US fluid ounce; the imperial one is 28.4 mL."
      - name: "Gill (US)"
        symbol: "gi"
        id: "volume_us_gill"
        guidance: "118 mL - four US fluid ounces, only met in old US cookbooks."
      - name: "Cup (US)"
        symbol: "cup"
        id: "volume_us_cup"
        guidance: "236.6 mL - the cup of US recipes, half a US pint. Metric countries use 250 mL."
      - name: "Cup (US legal, 240 mL)"
        symbol: "cup"
        id: "volume_us_legal_cup"
        guidance: "240 mL - the US nutrition-labelling cup, not the cup a US cookbook means."
      - name: "Pint (US liquid)"
        symbol: "pt"
        id: "volume_us_pint"
        guidance: "473 mL - the US pint, smaller than the 568 mL imperial pint."
      - name: "Quart (US liquid)"
        symbol: "qt"
        id: "volume_us_quart"
        guidance: "946 mL - two US pints, a quarter of a US gallon."
      - name: "Gallon (US liquid)"
        symbol: "gal"
        id: "volume_us_gallon"
        guidance: "3.79 L - the US gallon. British and pre-metric Australian recipes mean the 4.55 L imperial gallon."
      - name: "Barrel (petroleum)"
        symbol: "bbl"
        id: "volume_petroleum_barrel"
        guidance: "159 L - an oil-industry trade measure, never a kitchen one."

      # US customary dry units
      - name: "Pint (US dry)"
        symbol: "pt"
        id: "volume_us_dry_pint"
        guidance: "551 mL - a US measure for dry goods, not the liquid pint a recipe means."
      - name: "Quart (US dry)"
        symbol: "qt"
        id: "volume_us_dry_quart"
        guidance: "1.10 L - a US measure for dry goods, not a liquid measure."
      - name: "Gallon (US dry)"
        symbol: "gal"
        id: "volume_us_dry_gallon"
        guidance: "4.40 L - a US measure for dry goods, not the 3.79 L US liquid gallon."

      # Imperial liquid units
      - name: "Fluid Dram (imperial)"
        symbol: "fl dr"
        id: "volume_imperial_fluid_dram"
        guidance: "3.69 mL - the apothecaries' spoon of old British pharmacy."
      - name: "Fluid Ounce (imperial)"
        symbol: "fl oz"
        id: "volume_imperial_fluid_ounce"
        guidance: "28.4 mL - the fluid ounce of British cookbooks, and of Australian, New Zealand and Canadian ones before metrication."
      - name: "Gill (imperial)"
        symbol: "gi"
        id: "volume_imperial_gill"
        guidance: "142 mL - five imperial fluid ounces, the bar measure of spirits."
      - name: "Pint (imperial)"
        symbol: "pt"
        id: "volume_imperial_pint"
        guidance: "568 mL - the pint of British and pre-metric Australian recipes; a US pint is only 473 mL."
      - name: "Quart (imperial)"
        symbol: "qt"
        id: "volume_imperial_quart"
        guidance: "1.14 L - two imperial pints."
      - name: "Gallon (imperial)"
        symbol: "gal"
        id: "volume_imperial_gallon"
        guidance: "4.54609 L - the gallon Britain used, so also the one older Australian, New Zealand and Canadian recipes mean."
  - name: "Area"
    units:
      # Metric square units
      - name: "Square Millimeter"
        symbol: "mm²"
        id: "area_square_millimeter"
      - name: "Square Centimeter"
        symbol: "cm²"
        id: "area_square_centimeter"
      - name: "Square Decimeter"
        symbol: "dm²"
        id: "area_square_decimeter"
      - name: "Square Meter"
        symbol: "m²"
        id: "area_square_meter"
      - name: "Square Kilometer"
        symbol: "km²"
        id: "area_square_kilometer"
      - name: "Square Micrometer"
        symbol: "μm²"
        id: "area_square_micrometer"

      # Metric land units - the are is exactly 100 m2, the hectare exactly 100 a
      - name: "Are"
        symbol: "a"
        id: "area_are"
      - name: "Hectare"
        symbol: "ha"
        id: "area_hectare"

      # Imperial / US customary square units
      - name: "Square Inch"
        symbol: "in²"
        id: "area_square_inch"
      - name: "Square Foot"
        symbol: "ft²"
        id: "area_square_foot"
      - name: "Square Yard"
        symbol: "yd²"
        id: "area_square_yard"
      - name: "Square Mile"
        symbol: "mi²"
        id: "area_square_mile"

      # Land measures - 1 acre = 4840 yd2 = 4 rood = 160 sq rod, 1 rood = 40 sq rod
      - name: "Acre"
        symbol: "ac"
        id: "area_acre"
      - name: "Rood"
        symbol: "ro"
        id: "area_rood"
      - name: "Square Rod"
        symbol: "rd²"
        id: "area_square_rod"
  - name: "Weight"
    units:
      # Metric units
      - name: "Microgram"
        symbol: "μg"
        id: "weight_microgram"
      - name: "Milligram"
        symbol: "mg"
        id: "weight_milligram"
      - name: "Gram"
        symbol: "g"
        id: "weight_gram"
      - name: "Kilogram"
        symbol: "kg"
        id: "weight_kilogram"
      - name: "Tonne (metric ton)"
        symbol: "t"
        id: "weight_tonne"
      - name: "Quintal"
        symbol: "q"
        id: "weight_quintal"
      - name: "Carat (metric)"
        symbol: "ct"
        id: "weight_carat"

      # Avoirdupois units (US customary / imperial)
      - name: "Grain"
        symbol: "gr"
        id: "weight_grain"
      - name: "Dram (US)"
        symbol: "dr"
        id: "weight_dram"
      - name: "Ounce (US)"
        symbol: "oz"
        id: "weight_ounce"
      - name: "Pound (US / imperial)"
        symbol: "lb"
        id: "weight_pound"
      - name: "Stone (imperial)"
        symbol: "st"
        id: "weight_stone"
      - name: "Hundredweight (US short)"
        symbol: "cwt"
        id: "weight_hundredweight_short"
      - name: "Hundredweight (imperial long)"
        symbol: "cwt"
        id: "weight_hundredweight_long"
      - name: "Ton (US short)"
        symbol: "ton"
        id: "weight_short_ton"
      - name: "Ton (imperial long)"
        symbol: "ton"
        id: "weight_long_ton"

      # Troy units (precious metals)
      - name: "Pennyweight"
        symbol: "dwt"
        id: "weight_pennyweight"
      - name: "Ounce (troy)"
        symbol: "oz t"
        id: "weight_troy_ounce"
      - name: "Pound (troy)"
        symbol: "lb t"
        id: "weight_troy_pound"

      # Apothecaries' units
      - name: "Scruple (apothecary)"
        symbol: "㉈"
        id: "weight_scruple"
      - name: "Dram (apothecary)"
        symbol: "ℨ"
        id: "weight_apothecaries_dram"
      - name: "Ounce (apothecary)"
        symbol: "℥"
        id: "weight_apothecaries_ounce"
      - name: "Pound (apothecary)"
        symbol: "℔"
        id: "weight_apothecaries_pound"

  - name: "Energy"
    units:
      # Metric energy units - exact by definition of the SI prefixes, and the erg
      # is exactly 1e-7 J by the CGS definitions of the gram and the centimetre.
      - name: "Joule"
        symbol: "J"
        id: "energy_joule"
        guidance: "The SI unit - one newton acting through one metre."
      - name: "Kilojoule"
        symbol: "kJ"
        id: "energy_kilojoule"
        guidance: "What a European or Australian food label prints beside the kilocalorie."
      - name: "Megajoule"
        symbol: "MJ"
        id: "energy_megajoule"
      - name: "Gigajoule"
        symbol: "GJ"
        id: "energy_gigajoule"
        guidance: "The gas-industry figure - a cubic metre of natural gas is around 39 MJ."
      - name: "Erg"
        symbol: "erg"
        id: "energy_erg"
        guidance: "0.0000001 J - the CGS unit, still met in older physics texts."

      # The three legal calories - all close to 4.18 J, all defined as an exact
      # number of joules, so none of them needs a rounded factor.
      - name: "Calorie (IT)"
        symbol: "cal"
        id: "energy_calorie_it"
        guidance: "4.1868 J - the International Table calorie, the one steam and conversion tables mean."
      - name: "Kilocalorie (IT)"
        symbol: "kcal"
        id: "energy_kilocalorie_it"
        guidance: "4186.8 J - the capital-C Calorie of a food label is a kilocalorie of this kind."
      - name: "Calorie (thermochemical)"
        symbol: "cal"
        id: "energy_calorie_th"
        guidance: "4.184 J - the thermochemical calorie of chemistry tables."
      - name: "Calorie (15 °C)"
        symbol: "cal"
        id: "energy_calorie_15"
        guidance: "4.1855 J - the heat to warm 1 g of water from 14.5 to 15.5 °C; US food labelling defines its Calorie this way."

      # Electrical units - a watt is a joule per second and an hour is 3600 s, so a
      # watt-hour is exactly 3600 J and the meter reading is exact arithmetic.
      - name: "Watt-hour"
        symbol: "Wh"
        id: "energy_watt_hour"
        guidance: "3600 J exactly - one watt for one hour."
      - name: "Kilowatt-hour"
        symbol: "kWh"
        id: "energy_kilowatt_hour"
        guidance: "3.6 MJ - the unit the electricity meter counts."
      - name: "Megawatt-hour"
        symbol: "MWh"
        id: "energy_megawatt_hour"

      # Customary and industry units - the International Table Btu is defined as
      # exactly 1055.05585262 J, so the therm and the quad hang off it by exact
      # integers instead of long decimals.
      - name: "British thermal unit (IT)"
        symbol: "BTU"
        id: "energy_btu_it"
        guidance: "1055.06 J - the International Table Btu, the one behind the therm and the quad."
      - name: "British thermal unit (thermochemical)"
        symbol: "BTU"
        id: "energy_btu_th"
        guidance: "1054.35 J - the Btu of thermochemistry, about 0.07% under the IT Btu."
      - name: "Therm"
        symbol: "thm"
        id: "energy_therm"
        guidance: "100000 BTU (IT) - what a gas bill charges, and roughly the heat in one ccf of natural gas."
      - name: "Quad"
        symbol: "quad"
        id: "energy_quad"
        guidance: "1e15 BTU - national energy statistics; US demand runs near 100 quads a year."
      - name: "Horsepower-hour"
        symbol: "hp-h"
        id: "energy_horsepower_hour"
        guidance: "One mechanical horsepower for one hour - exactly 1980000 ft-lbf."
      - name: "Foot-pound-force"
        symbol: "ft-lbf"
        id: "energy_foot_pound_force"
        guidance: "1.356 J - one pound-force through one foot, the work unit of US engineering."
      - name: "Electronvolt"
        symbol: "eV"
        id: "energy_electronvolt"
        guidance: "1.602e-19 J - what an electron gains across one volt; exact since the 2019 SI."

  - name: "Force"
    units:
      # Metric force units - the newton is kg x m/s2, so the SI prefixes are exact
      # and the dyne is exactly 1e-5 N by the CGS definitions.
      - name: "Newton"
        symbol: "N"
        id: "force_newton"
        guidance: "The SI unit - the force that accelerates 1 kg at 1 m/s²."
      - name: "Kilonewton"
        symbol: "kN"
        id: "force_kilonewton"
        guidance: "The unit of bolt, rope and structural ratings."
      - name: "Meganewton"
        symbol: "MN"
        id: "force_meganewton"
      - name: "Dyne"
        symbol: "dyn"
        id: "force_dyne"
        guidance: "0.00001 N - the CGS unit, still in surface-tension and viscosity tables."
      - name: "Kilogram-force"
        symbol: "kgf"
        id: "force_kilogram_force"
        guidance: "9.807 N - the weight of a kilogram under standard gravity; also called the kilopond."
      - name: "Gram-force"
        symbol: "gf"
        id: "force_gram_force"
        guidance: "0.00981 N - spring and watchmaking specifications."
      - name: "Tonne-force"
        symbol: "tf"
        id: "force_tonne_force"
        guidance: "1000 kgf - jack, press and anchor ratings."

      # Imperial / US customary force units - pound-force is the 1959 pound under
      # standard gravity and the poundal is that pound accelerated at 1 ft/s2, so
      # both are exact decimals of the newton.
      - name: "Pound-force"
        symbol: "lbf"
        id: "force_pound_force"
        guidance: "4.448 N - the weight of a 1 lb mass under standard gravity."
      - name: "Ounce-force"
        symbol: "ozf"
        id: "force_ounce_force"
        guidance: "0.278 N - a sixteenth of a pound-force; spring and connector retention ratings."
      - name: "Poundal"
        symbol: "pdl"
        id: "force_poundal"
        guidance: "0.138 N - 1 lb accelerated at 1 ft/s², the absolute British unit."
      - name: "Short ton-force"
        symbol: "short tonf"
        id: "force_short_ton_force"
        guidance: "2000 lbf - US press and crane ratings; the long ton-force is 2240 lbf."
      - name: "Long ton-force"
        symbol: "long tonf"
        id: "force_long_ton_force"
        guidance: "2240 lbf - the older British engineering figure; a US short ton-force is 2000 lbf."
      - name: "Kip"
        symbol: "kip"
        id: "force_kip"
        guidance: "1000 lbf - US structural engineering, as in a 20 kip beam load."
# Conversion Formulas
# Each conversion item has its own menu item in the "Unit Conversions" section.
# X is the input value.
# Each id corresponds to a unit defined in the units section above.
# The ids are used to map the input and output units to the correct formulas.
# A conversion path will be automatically found using the input and output unit ids, and the corresponding formulas will be applied in sequence to get the final result.
# Conversion paths can also go backwards if it is a MD type
# Types:
# MD: Multi-Directional (can convert both ways) - the program will automatically reverse the formula by swapping the operations (eg. X * 1000 becomes X / 1000, 500 + 123 becomes 500 - 123 and vice versa) if it cannot find a path forwards.
# UD: Uni-Directional (can only convert one way) - the program will not reverse the formula and error if it cannot find a path backwards.
# X should be x (lowercase) in the formula, and it will be replaced with the input value during the conversion process.
conversions:
  - name: "Length Conversion"
    icon: "ft.Icons.STRAIGHTEN"
    description: "Convert between meters, kilometers, etc."
    formulas:
      # Metric units - exact by definition of the SI prefixes, so every hop is a
      # power of ten and stays exact in both directions.
      1:
        type: "MD"
        input_unit_id: "length_nanometer"
        output_unit_id: "length_micrometer"
        formula: "x / 1000"
      2:
        type: "MD"
        input_unit_id: "length_micrometer"
        output_unit_id: "length_millimeter"
        formula: "x / 1000"
      3:
        type: "MD"
        input_unit_id: "length_millimeter"
        output_unit_id: "length_centimeter"
        formula: "x / 10"
      4:
        type: "MD"
        input_unit_id: "length_centimeter"
        output_unit_id: "length_meter"
        formula: "x / 100"
      5:
        type: "MD"
        input_unit_id: "length_meter"
        output_unit_id: "length_kilometer"
        formula: "x / 1000"
      # Imperial units - the 1959 international yard and pound agreement defines
      # the yard as exactly 0.9144 m, hence the inch as exactly 25.4 mm and the
      # mile as exactly 1609.344 m; the nautical mile is exactly 1852 m. The
      # bridges to the metric chain are written as the exact multiplication, so a
      # route from an imperial unit to a metric one never starts with a division
      # that cannot be written in decimal.
      6:
        type: "MD"
        input_unit_id: "length_inch"
        output_unit_id: "length_millimeter"
        formula: "x * 25.4"
      7:
        type: "MD"
        input_unit_id: "length_inch"
        output_unit_id: "length_foot"
        formula: "x / 12"
      8:
        type: "MD"
        input_unit_id: "length_foot"
        output_unit_id: "length_yard"
        formula: "x / 3"
      9:
        type: "MD"
        input_unit_id: "length_yard"
        output_unit_id: "length_mile"
        formula: "x / 1760"
      10:
        type: "MD"
        input_unit_id: "length_mile"
        output_unit_id: "length_meter"
        formula: "x * 1609.344"
      11:
        type: "MD"
        input_unit_id: "length_nautical_mile"
        output_unit_id: "length_meter"
        formula: "x * 1852"
      # Astronomical units - exact by IAU resolution: 1 AU = 149597870700 m and a
      # light-year, being c over a Julian year, is exactly 9460730472580800 m. An
      # integer literal stays exact however long it is; only decimal literals are
      # limited to the 15 significant digits the engine can parse.
      12:
        type: "MD"
        input_unit_id: "length_kilometer"
        output_unit_id: "length_astronomical_unit"
        formula: "x / 149597870.7"
      13:
        type: "MD"
        input_unit_id: "length_light_year"
        output_unit_id: "length_meter"
        formula: "x * 9460730472580800"
      # A parsec is 648000/pi astronomical units, so its factor is not a rational
      # number at all. This is the one Length hop that cannot be written exactly,
      # and it carries the most digits the engine can parse.
      14:
        type: "MD"
        input_unit_id: "length_light_year"
        output_unit_id: "length_parsec"
        formula: "x / 3.2615637771674"
      15:
        type: "MD"
        input_unit_id: "length_parsec"
        output_unit_id: "length_kiloparsec"
        formula: "x / 1000"
      16:
        type: "MD"
        input_unit_id: "length_kiloparsec"
        output_unit_id: "length_megaparsec"
        formula: "x / 1000"
      17:
        type: "MD"
        input_unit_id: "length_megaparsec"
        output_unit_id: "length_gigaparsec"
        formula: "x / 1000"
      18:
        type: "MD"
        input_unit_id: "length_terameter"
        output_unit_id: "length_meter"
        formula: "x * 1000000000000"

  - name: "Time Conversion"
